aid: hotcake
name: hotcake 夯客
description: >-
  HOTCAKE 夯客 (Hotcake Inc. / 夯客股份有限公司) is a Taipei, Taiwan SaaS platform for the beauty
  and wellness industry — hair salons, nail and lash studios, skincare and medical
  beauty clinics, massage and fitness. It gives merchants an intuitive appointment,
  membership, and POS system covering 24-hour automated online booking, member passports
  and tagging, stored-value and voucher/loyalty programs, checkout and revenue analytics,
  inventory management, staff scheduling, and marketing automation. HOTCAKE is a LINE
  official-account technical partner and integrates LINE Pay, third-party payment
  gateways, and Google Calendar/Maps. It is delivered as a subscription with no long-term
  contract and same-day go-live. HOTCAKE was surfaced as a 500 Global portfolio company
  and added to the API Evangelist network; it ships mobile merchant apps and a merchant
  documentation/help manual, but publishes no public developer API, OpenAPI, or SDK.
